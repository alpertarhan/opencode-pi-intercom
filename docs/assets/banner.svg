<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="opencode-pi-intercom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#182035"/>
    </linearGradient>
  </defs>
  <rect width="860" height="260" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <text x="430" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" fill="#e6edf3">opencode-pi-intercom</text>
  <text x="430" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#8b949e">Agentic intercom for OpenCode · omp · pi — one broker, one roster</text>

  <!-- omp peer -->
  <rect x="105" y="140" width="130" height="44" rx="10" fill="#0d1117" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="170" y="167" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#60a5fa">omp session</text>

  <!-- broker -->
  <rect x="365" y="140" width="130" height="44" rx="10" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="430" y="160" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#fbbf24">broker</text>
  <text x="430" y="177" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8b949e">protocol v1</text>

  <!-- pi peer -->
  <rect x="625" y="140" width="130" height="44" rx="10" fill="#0d1117" stroke="#22c55e" stroke-width="1.5"/>
  <text x="690" y="167" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#22c55e">pi session</text>

  <!-- opencode peer -->
  <rect x="365" y="212" width="130" height="40" rx="10" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430" y="237" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#a78bfa">opencode</text>

  <!-- links -->
  <g stroke="#8b949e" stroke-width="1.5">
    <line x1="235" y1="162" x2="365" y2="162"/>
    <line x1="495" y1="162" x2="625" y2="162"/>
    <line x1="430" y1="184" x2="430" y2="212"/>
  </g>
  <g fill="#8b949e">
    <path d="M365 156 l10 6 -10 6 z"/>
    <path d="M241 156 l-10 6 10 6 z"/>
    <path d="M625 156 l10 6 -10 6 z"/>
    <path d="M501 156 l10 6 -10 6 z"/>
    <path d="M424 206 l6 10 6 -10 z"/>
    <path d="M424 250 l6 -10 6 10 z"/>
  </g>
</svg>
